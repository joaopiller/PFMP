name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # O build também valida a sintaxe de src/data/posts.js e gera
      # todas as páginas estáticas, então quebra se um artigo estiver errado.
      - name: Build
        run: npm run build
